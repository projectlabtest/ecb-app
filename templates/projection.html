<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIGHT WORSHIP APP — {{ channel }}</title>
  <style id="themeVars">
    /* Default theme (Navy/Teal) — inline so it works without the static server
       serving individual theme CSS files. Each theme sets the same variables. */
    :root {
      --proj-bg: #0b1533; --proj-dark: #071024; --proj-white: #f4f6ff;
      --proj-off-white: #dde3f5; --proj-gold: #14B8A6; --proj-gold-lt: #2DD4BF;
      --proj-muted: #8a94b5; --font-body: "Segoe UI", Arial, sans-serif;
      --font-heading: "Segoe UI", Arial, sans-serif;
    }
    body[data-theme="midnight"] { --proj-bg:#07090f; --proj-dark:#04060b; --proj-white:#e8ecf6; --proj-off-white:#c9d0e2; --proj-gold:#b8932e; --proj-gold-lt:#d3b354; --proj-muted:#6b7290; }
    body[data-theme="dawn"]     { --proj-bg:#2a1b3d; --proj-dark:#1d1229; --proj-white:#fbeef6; --proj-off-white:#ecd8ea; --proj-gold:#e0a45e; --proj-gold-lt:#eec07f; --proj-muted:#9c86a8; }
    body[data-theme="forest"]   { --proj-bg:#0f2418; --proj-dark:#08150d; --proj-white:#eef6ef; --proj-off-white:#d8e8da; --proj-gold:#b7a14a; --proj-gold-lt:#cfbd6d; --proj-muted:#6f9b7a; }
    body[data-theme="slate"]    { --proj-bg:#1e2733; --proj-dark:#121820; --proj-white:#eef2f7; --proj-off-white:#d5dde8; --proj-gold:#c9a227; --proj-gold-lt:#dcc05a; --proj-muted:#7b8aa0; }
    body[data-theme="ivory"]    { --proj-bg:#f7f3e8; --proj-dark:#ece4d0; --proj-white:#2c2c26; --proj-off-white:#3a3a32; --proj-gold:#9a7b2f; --proj-gold-lt:#b8973f; --proj-muted:#6f6a58; }
    body[data-theme="ocean"]    { --proj-bg:#062a44; --proj-dark:#041a2c; --proj-white:#eaf5fb; --proj-off-white:#cfe4f0; --proj-gold:#45b6d0; --proj-gold-lt:#74cfe4; --proj-muted:#6f9cbb; }
    body[data-theme="ember"]    { --proj-bg:#2b0f07; --proj-dark:#1b0804; --proj-white:#fef1ea; --proj-off-white:#f3d9c9; --proj-gold:#e2723a; --proj-gold-lt:#ee925f; --proj-muted:#b07862; }
    body[data-theme="pearl"]    { --proj-bg:#f2eeee; --proj-dark:#e6dede; --proj-white:#2a2a2e; --proj-off-white:#38383d; --proj-gold:#9c8550; --proj-gold-lt:#b6a06a; --proj-muted:#7c7570; }
    body[data-theme="royal"]    { --proj-bg:#1a1040; --proj-dark:#0f0a2b; --proj-white:#f2efff; --proj-off-white:#dcd6f5; --proj-gold:#c9a227; --proj-gold-lt:#dbc05a; --proj-muted:#7770a8; }
  </style>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: var(--proj-bg);
      color: var(--proj-white);
      font-family: var(--font-body);
      overflow: hidden;
    }

    /* ── Projection aspect-ratio wrapper ── */
    #proj-frame {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--proj-bg);
      overflow: hidden;
    }
    #proj-content {
      width: 100vw; height: 100vh;
      position: relative;
      transform-origin: center center;
    }

    /* ── Fullscreen slide container (message layer) ── */
    #layer-message {
      position: absolute; inset: 0;
      background: var(--proj-bg);
      transition: opacity 0.25s ease;
    }
    #slide {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 4vw 6vw;
      position: relative;
    }
    #layer-message.active { display: block; }
    /* When media (video/image) is behind it, let that show through: transparent
       background + readable text shadow (see .has-backdrop). */
    #layer-message.has-backdrop {
      background: transparent;
    }

    /* ── Blank ── */
    #slide.type-blank {
      background: #000;
    }



    .slide-header {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 2vw;
      flex-wrap: wrap;
      margin-bottom: 1.8rem;
    }

    .slide-part-label {
      font-family: var(--font-body);
      font-size: clamp(1.5rem, 5vw, 4rem);
      font-weight: 700;
      color: var(--proj-gold);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
      white-space: nowrap;
    }

    .slide-verse-ref {
      font-family: var(--font-body);
      font-size: clamp(1.2rem, 4vw, 3rem);
      font-weight: 700;
      color: var(--proj-gold);
      letter-spacing: 0.1em;
      text-align: center;
      white-space: nowrap;
      margin-bottom: 1.2rem;
    }

.slide-part {
      font-family: var(--font-heading);
      font-size: clamp(2.5rem, 10vw, 7.5rem);
      font-weight: 700;
      color: var(--proj-off-white);
      text-align: center;
      line-height: 1.15;
    }

    .slide-part--content {
      color: var(--proj-gold);
    }

    .slide-hymn-number {
      font-size: clamp(1.5rem, 6vw, 4.5rem);
      font-style: italic;
      color: var(--proj-gold);
      letter-spacing: 0.08em;
      margin-top: -1rem;
      margin-bottom: 1rem;
      text-align: center;
    }

    .slide-stanza-label {
      font-size: clamp(0.6rem, 1.2vw, 0.85rem);
      color: var(--proj-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.8rem;
      text-align: center;
    }

    .slide-song-title {
      font-family: var(--font-body);
      font-size: clamp(0.8rem, 1.6vw, 1.3rem);
      color: var(--proj-gold);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 1rem;
    }

    .slide-lines {
      display: flex; flex-direction: column;
      align-items: center; gap: 0.1em;
      width: 100%;
    }

    .slide-line {
      font-family: var(--font-heading);
      font-size: 1em;
      color: var(--proj-off-white);
      text-align: center;
      line-height: 1.35;
      width: 100%;
    }

    /* Body text (non-song items) */
    .slide-body {
      font-size: clamp(2rem, 7vw, 5rem);
      font-weight: 700;
      color: var(--proj-off-white);
      text-align: center;
    }

    .slide-participants {
      margin-top: 0.6rem;
      display: flex; flex-direction: column;
      align-items: center; gap: 1.2rem;
    }

    .slide-participant {
      display: flex; flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Scale name by participant count */
    /* All counts share the same base — "Michaella Grace Palar" is the standard */
    .slide-participant .name {
      font-family: var(--font-heading);
      font-size: clamp(3rem, 13vw, 9.5rem);
      color: var(--proj-off-white);
      font-weight: 700;
      line-height: 1.05;
      white-space: nowrap;
    }

    /* ── Announcement ── */
    #layer-announcement {
      background: var(--proj-dark);
    }

    .announcement-label {
      font-size: clamp(0.7rem, 1.3vw, 0.95rem);
      color: var(--proj-gold);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 1rem;
      text-align: center;
    }

    .announcement-text {
      font-family: var(--font-heading);
      font-size: clamp(1.8rem, 4vw, 3.2rem);
      color: var(--proj-white);
      text-align: center;
      line-height: 1.4;
      max-width: 80vw;
    }

    /* ── Timer ── */
    #layer-message.type-timer {
      background: var(--proj-dark);
    }

    .timer-digits {
      font-family: var(--font-heading);
      font-size: clamp(5rem, 18vw, 14rem);
      font-weight: 700;
      color: var(--proj-gold-lt);
      letter-spacing: 0.05em;
      line-height: 1;
      text-align: center;
    }

    .timer-digits.urgent {
      color: #e05252;
    }

    .timer-label {
      font-size: clamp(1rem, 2.5vw, 1.8rem);
      color: var(--proj-muted);
      text-align: center;
      margin-top: 1.2rem;
      letter-spacing: 0.06em;
    }

    /* ── Media ── */
    #layer-video, #layer-image {
      padding: 0;
      background: transparent;   /* let the theme / custom BG show through the
                                    letterbox areas instead of black bars */
      overflow: hidden;
    }

    /* Blurred background layer for portrait/narrow images */
    .layer-image .img-blur-bg {
      position: absolute;
      inset: -30px;          /* overshoot to hide blur fade at edges */
      background-size: cover;
      background-position: center;
      filter: blur(28px);
      transform: scale(1.05);
      display: none;
    }

    .layer-image .img-main {
      width: 100%; height: 100%;
      position: relative;
      z-index: 1;
      object-fit: contain;   /* keep the full input visible; never stretch to
                                cover a wider custom screen */
    }

    .layer-video video {
      width: 100%; height: 100%;
      object-fit: contain;
      background: transparent;   /* let the theme / custom BG show through the
                                    letterbox areas instead of black bars */
    }

    .layer-video iframe {
      width: 100%; height: 100%;
      border: none;
    }

    /* ── YouTube blocked overlay ── */
    .yt-blocked-overlay {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      width: 100%; height: 100%; gap: 1rem;
      background: #080808;
    }
    .yt-blocked-icon { font-size: 3rem; }
    .yt-blocked-msg  { font-size: 1.3rem; color: #e07070; text-align: center; padding: 0 2rem; }
    .yt-blocked-hint { font-size: 0.85rem; color: #777; }

    /* ── Waiting state ── */
    #waiting {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 0.6rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
    }

    #waiting.visible {
      opacity: 1;
    }

    .waiting-dot {
      width: 8px; height: 8px;
      background: var(--proj-muted);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    .waiting-text {
      font-size: 0.85rem;
      color: var(--proj-muted);
      letter-spacing: 0.08em;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50%       { opacity: 1;   transform: scale(1);   }
    }

    /* ── Channel badge (top-right corner) ── */
    #channel-badge {
      position: fixed;
      top: 12px; right: 16px;
      font-size: 0.65rem;
      color: var(--proj-muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.4;
      pointer-events: none;
    }

    /* ── Custom theme background layer ── */
    #custom-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 0;
      pointer-events: none;
    }
    #custom-bg.visible { opacity: 1; }

    #waiting { z-index: 10; }

    /* ── Background layer switch (operator BG rail) ──
       Toggling the BG layer OFF masks the ENTIRE background (theme colors AND
       the custom image) to black — no input, no output. The theme colors live
       on #proj-frame, so they must hide too, not just the custom image. */
    body.bg-off #proj-frame { background: #000 !important; }
    body.bg-off #custom-bg { opacity: 0 !important; }

    /* When the custom background image is shown, let it show through by making
       the message layer transparent (the image is a fixed layer behind it). */
    #custom-bg.visible ~ #layer-message { background: transparent !important; }
    /* Same for the video/image layers so the background visible in the
       letterbox areas (object-fit: contain) instead of hard black bars. */
    #custom-bg.visible ~ #layer-video { background: transparent; }
    #custom-bg.visible ~ #layer-image { background: transparent; }
    #custom-bg.visible ~ #layer-message #slide .slide-header,
    #custom-bg.visible ~ #layer-message #slide .slide-part,
    #custom-bg.visible ~ #layer-message #slide .slide-part-label,
    #custom-bg.visible ~ #layer-message #slide .slide-body,
    #custom-bg.visible ~ #layer-message #slide .slide-lines,
    #custom-bg.visible ~ #layer-message #slide .slide-participants {
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }

    /* ── Layer stack (bottom -> top) ───────────────────────────────────────── */
    /* Each content type owns a full-bleed, absolutely-positioned layer so that
       multiple outputs can be composed on a single display (e.g. live video as
       the background with lyrics overlaid), instead of one type replacing the
       previous one. The z-index ordering below matches the fixed layer slots:
         1 background  2 video  3 image  4 message  5 announcement */
    .proj-layer {
      position: absolute;
      inset: 0;
      display: none;
      overflow: hidden;
      pointer-events: none;
    }
    .proj-layer.active { display: block; }

    /* background is #custom-bg (z:0). Video sits ABOVE image so a video can
       play over any still image that is still mounted on another layer. */
    #custom-bg { z-index: 0; }
    #layer-video      { z-index: 2; background: transparent; }
    #layer-image      { z-index: 1; background: transparent; }
    #layer-message    { z-index: 3; }
    #layer-announcement { z-index: 4; }

    /* Announcement layer centres its content when shown. */
    #layer-announcement.active {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    /* Master OFF (operator rail): masks every content layer (video/image/message/
       announcement) at once while keeping the themed background. The DOM keeps
       its layers intact, so a second click restores everything untouched —
       media keeps playing, nothing is torn down. background is #custom-bg, not
       a .proj-layer, so it stays visible under the mask. */
    body.layers-off .proj-layer { display: none !important; }
    /* The PiP live box is content too — hide it under Master OFF as well. */
    body.layers-off #pip-box { display: none !important; }

    /* Reuse existing per-type slide styling inside the layer slots. */
    .proj-layer .slide-template {
      width: 100%; height: 100%;
      padding: 4vw 6vw;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .proj-layer.layer-video, .proj-layer.layer-image {
      background: transparent;   /* let the theme / custom BG show through the
                                    letterbox areas instead of black bars */
    }

    /* Lyrics / message over a live background: keep text readable with a soft
       translucent panel and a text shadow (toggle via #layer-message.plain). */
    #layer-message .msg-panel {
      padding: 3vh 4vw;
    }
    #layer-message.has-backdrop #slide .slide-lines,
    #layer-message.has-backdrop #slide .slide-body,
    #layer-message.has-backdrop #slide .slide-part,
    #layer-message.has-backdrop #slide .slide-hymn-number,
    #layer-message.has-backdrop #slide .slide-part-label,
    #layer-message.has-backdrop #slide .slide-header {
      text-shadow: 0 2px 6px rgba(0,0,0,0.85), 0 0 2px rgba(0,0,0,0.9);
    }

    /* ── Picture-in-Picture live box ──
       Content stays full-screen; the live camera mounts in a small fixed-size
       box in a corner when the operator pushes media:live with pip_enable.
       Config (on/off, corner, size) rides along that media:live data, relayed
       verbatim by the server — same contract as custom_output.html. */
    #pip-box {
      position: absolute;
      z-index: 100;
      display: none;
      background: #000;
      border: 2px solid rgba(255,255,255,0.85);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.55);
      line-height: 0;
    }
    #pip-box.visible { display: block; }
    #pip-box img {
      width: 100%; height: 100%;
      object-fit: contain;
      display: block;
    }
    /* ── Remote screen-share overlay ──
       Full-screen live image from a /share presenting PC, shown only after
       the operator explicitly selects that presenter for this channel
       (live:start), fed frame-by-frame (live:frame), torn down on
       live:stop. Sits above the slide layers but below the PiP box, and is
       hidden whenever anything else takes the screen. */
    #live-remote-wrap {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: none;
      background: #000;
    }
    #live-remote-wrap.visible { display: block; }
    #live-remote-wrap img {
      width: 100%; height: 100%;
      object-fit: contain;
      display: block;
    }
    #pip-box .pip-live-tag {
      position: absolute;
      top: 6px; left: 8px;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: rgba(0,0,0,0.65);
      color: #14B8A6;
      padding: 2px 7px;
      border-radius: 4px;
      line-height: 1.4;
    }
    #pip-box.corner-tr { top: 18px; right: 18px; }
    #pip-box.corner-tl { top: 18px; left: 18px; }
    #pip-box.corner-br { bottom: 18px; right: 18px; }
    #pip-box.corner-bl { bottom: 18px; left: 18px; }
    #pip-box.size-sm { width: 26vw; max-width: 360px; aspect-ratio: 16 / 9; }
    #pip-box.size-md { width: 36vw; max-width: 500px; aspect-ratio: 16 / 9; }
    #pip-box.size-lg { width: 48vw; max-width: 680px; aspect-ratio: 16 / 9; }

  </style>
</head>
<body>

<div id="proj-frame">
<div id="proj-content">

<div id="channel-badge">{{ channel }}</div>

<div id="custom-bg" data-bg="{{ (custom_theme.slots[custom_theme.active] or '') }}" {% if custom_theme.slots and custom_theme.slots[custom_theme.active] %}data-hasbg="1"{% endif %}></div>

<!-- Layer 1: background (theme / wallpaper) — sits behind everything -->

<!-- Layer 2: video (live / video / youtube) -->
<div id="layer-video" class="proj-layer layer-video"></div>

<!-- Layer 3: image -->
<div id="layer-image" class="proj-layer layer-image"></div>

<!-- Layer 4: message / lyrics / text / order-of-service -->
<div id="layer-message" class="proj-layer layer-message">
  <div id="slide" class="type-blank"></div>
</div>

<!-- Layer 5: announcement -->
<div id="layer-announcement" class="proj-layer layer-announcement"></div>

<!-- Picture-in-Picture live box (hidden until a media:live pip push arrives) -->
<div id="pip-box" class="corner-tr size-md">
  <span class="pip-live-tag">LIVE</span>
  <img id="pip-img" alt="">
</div>

<!-- Remote screen-share overlay (hidden until the operator selects a /share presenter for this channel) -->
<div id="live-remote-wrap">
  <img id="live-remote-img" alt="">
</div>

<div id="waiting" class="visible">
  <div class="waiting-dot"></div>
  <div class="waiting-text">Waiting for content…</div>
</div>

</div>
</div>

</script>
<script>
  const CHANNEL = '{{ channel }}';
  // Broadcast-only PiP: the headless broadcast render loads this page as
  // /ch1?broadcast=1 and mounts the PiP live box there. The projector, the
  // output window and the operator-monitor preview (plain /ch1) keep their
  // clean full-screen content -- PiP never appears on them.
  const IS_BROADCAST = location.search.indexOf('broadcast=1') !== -1;
  const socket  = io({
    transports: ['websocket', 'polling'],
    reconnection: true,
    reconnectionDelay: 300,
    reconnectionDelayMax: 1000,
    randomizationFactor: 0.5,
    timeout: 4000,
    pingInterval: 15000,
    pingTimeout: 8000,
  });

  // ── Timer state ────────────────────────────────────────────────────────────
  let _timerInterval = null;
  let _timerSeconds  = 0;
  let _timerLabel    = '';

  // ── Socket events ──────────────────────────────────────────────────────────
  // While a state:restore reply comes back, don't re-run a *live* (or blank)
  // command — the live input must only appear when the operator explicitly
  // triggers it, not because the projection page re-loaded and restored state.
  let _restoring = false;
  socket.on('connect', function () {
    socket.emit('join', { channel: CHANNEL });
    _restoring = true;
    socket.emit('state:restore', { channel: CHANNEL });
    // Never auto-restore a live/blank command for the first several seconds after
    // load. Only an explicit operator command (sent later) shows it.
    setTimeout(function () { _restoring = false; }, 6000);
  });

  socket.on('slide:show',   function (data) {
    // NEVER restore a live/blank via slide:show. State restore delivers the
    // last pushed command as a slide:show {type:'live'}; rendering it would open
    // the infinite MJPEG stream (/live/feed/N.mjpeg) on every projection reload,
    // which exhausts the server's workers and blocks the whole app. Live is only
    // ever shown via a real media:live command, so skip live/blank here entirely.
    if (data && (data.type === 'live' || data.type === 'blank')) return;
    // Skip ALL other restored content (text/image/video) during the load window.
    if (_restoring) return;
    renderState(data);
  });
  socket.on('slide:blank',  function (data) { _hidePip(); renderState(data); });
  socket.on('slide:edit',   function (data) { renderState(data); });
  socket.on('announcement', function (data) { renderState(data); });

  socket.on('media:image',  function (data) { renderState(data); });
  socket.on('media:video',  function (data) { renderState(data); });
  socket.on('media:live',   function (data) { handleLive(data); });
  socket.on('pip:set',      function (data) { handlePip(data); });

  // Remote screen-share from a /share presenting PC (see the share bridge in
  // live_input.py). Shown only after the operator selects the presenter for
  // this channel. Separate listeners on purpose: existing content handlers
  // below are untouched; the overlay simply hides whenever anything else
  // takes the screen.
  socket.on('live:start',   function (data) { _remoteShow(data); });
  socket.on('live:frame',   function (data) { _remoteFrame(data); });
  socket.on('live:stop',    function ()     { _remoteHide(); });
  socket.on('slide:show',   function ()     { _remoteHide(); });
  socket.on('slide:blank',  function ()     { _remoteHide(); });

  socket.on('timer:show',   function (data) { renderTimer(data); });
  socket.on('timer:start',  function (data) { startTimer(data); });
  socket.on('timer:pause',  function ()     { pauseTimer(); });
  socket.on('timer:reset',  function (data) { resetTimer(data); });

  socket.on('roles:updated', function (data) {
    var newRole = (data.assignments || {})[CHANNEL];
    if (newRole && newRole !== '{{ role }}') { window.location.reload(); }
  });

  // Operator toggled a layer from the monitor rail — apply to this projection
  // channel too, so hiding a layer here removes it from the real output screens.
  socket.on('layer:set', function (data) {
    var ldata = data || {};
    var layer = ldata.layer;
    var show  = !!ldata.show;
    if (!layer) return;
    try {
      if (layer === 'background') {
        var el = document.getElementById('custom-bg');
        if (el) { el.classList.toggle('visible', show); el.classList.toggle('active', show); }
        // The theme color lives on #proj-frame, so mask the whole background
        // (colors + image) to black when the BG layer is off.
        document.body.classList.toggle('bg-off', !show);
      } else if (layer === 'off') {
        // Master OFF: mask every content layer at once (show=false hides them,
        // show=true restores). Layers keep their DOM/media untouched, so this is
        // fully reversible. The themed background always stays visible.
        document.body.classList.toggle('layers-off', show);
      } else if (show) {
        _showLayer(layer);
      } else {
        _hideLayer(layer);
      }
      _updateMessageBackdrop();
    } catch (e) {}
  });

  // ── Render dispatcher ──────────────────────────────────────────────────────
  // ── Theme switching ──────────────────────────────────────────────────────
  let _currentTheme = 'default';

  function _applyCustomBg(themeId, bgUrl) {
    const customBg = document.getElementById('custom-bg');
    if (!customBg) return;
    if (bgUrl !== undefined && bgUrl !== null) {
      customBg.setAttribute('data-bg', bgUrl);
    }
    const cur = (bgUrl !== undefined && bgUrl !== null) ? bgUrl : (customBg.getAttribute('data-bg') || '');
    customBg.style.backgroundImage = cur ? `url('${cur}')` : '';
    // Only show the custom background when a custom image is actually set. Never
    // force-hide it here based on a non-'custom' theme id (e.g. a video's default
    // theme), because that would wipe the operator's chosen background while a
    // video/live layer plays on top of it.
    const show = !!cur;
    customBg.classList.toggle('visible', show);
    if (customBg.hasAttribute('data-hasbg')) {
      customBg.setAttribute('data-hasbg', show ? '1' : '0');
    }
  }

  function applyTheme(themeId) {
    if (!themeId) return;
    // Themes are applied inline (see #themeVars) — swap the data-theme on body.
    document.body.setAttribute('data-theme', themeId);
    _currentTheme = themeId;
    if (themeId === 'custom') {
      _applyCustomBg(themeId);
    }
  }

  // Operator changed the theme dropdown — apply immediately even without a slide.
  socket.on('theme:apply', function (data) {
    const themeId = data && data.theme_id;
    if (!themeId) return;
    document.body.setAttribute('data-theme', themeId);
    _currentTheme = themeId;
    // The background is the bottom layer (z:0). Changing it (including a custom
    // background image) must NOT disturb any layers above it — video, image,
    // message, announcement and custom all stay intact.
    _applyCustomBg(themeId, data && data.custom_bg);
  });

  function renderState(state) {
    const type = state.type || 'blank';
    applyTheme(state.theme_id || (state.data && state.data.theme_id));
    stopTimer();

    // One-at-a-time output: every new push replaces whatever is on screen, so
    // the last sent item is the only thing visible (over the background). The
    // old additive layer composition is dropped — that stacking is what made
    // lyrics/videos/images pile up on one display.
    _clearLayers();

    switch (type) {
      case 'text':         renderText(state.data || state);  break;
      case 'blank':        renderBlank();                     break;
      case 'announcement': renderAnnouncement(state.data || state); break;
      case 'image':        renderImage(state.data || state);  break;
      case 'video':        renderVideo(state.data || state);  break;
      case 'live':         renderLive(state.data || state);   break;
      case 'timer':        renderTimer(state.data || state);  break;
      default:             renderBlank();
    }
  }

  // ── Layer helpers ───────────────────────────────────────────────────────────
  // Each content type renders into its own fixed layer slot so outputs can be
  // composed on one display instead of replacing each other. Layers stack by
  // priority (background < video < image < message < announcement < custom).
  const _LAYER_IDS = {
    video:        'layer-video',
    image:        'layer-image',
    message:      'layer-message',
    announcement: 'layer-announcement',
  };
  let _activeLayers = new Set();

  function _layerEl(name) {
    return document.getElementById(_LAYER_IDS[name]);
  }
  function _showLayer(name) {
    const el = _layerEl(name);
    if (el) el.classList.add('active');
    _activeLayers.add(name);
  }
  function _stopMedia(name) {
    // Hiding the video layer must also stop the media, otherwise audio keeps
    // playing from the now-hidden <video>/<iframe>. Tear it down on hide.
    if (name !== 'video') return;
    const slide = _layerEl('video');
    if (!slide) return;
    // Video element (mp4 / live device feed).
    const vid = slide.querySelector('video');
    if (vid) { try { vid.pause(); vid.removeAttribute('src'); vid.load(); } catch (e) {} }
    // Live MJPEG image.
    const img = slide.querySelector('img[src*="/live/feed/"]');
    if (img) { try { img.removeAttribute('src'); } catch (e) {} }
    // Stop any in-flight browser-camera streams.
    Object.keys(_liveStreams || {}).forEach(function (k) {
      try { (_liveStreams[k] || {}).getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
    });
    _liveStreams = {};
    // Clear the dedupe key so the same item can be re-pulled cleanly next time.
    _curMediaKey = null;
    // Remove any mounted media element so a fresh render rebuilds it.
    slide.innerHTML = '';
  }

  function _hideLayer(name) {
    const el = _layerEl(name);
    if (el) el.classList.remove('active');
    _activeLayers.delete(name);
    _stopMedia(name);
    _updateMessageBackdrop();
  }
  function _clearLayers() {
    Object.keys(_LAYER_IDS).forEach(function (n) {
      const el = _layerEl(n);
      if (el) el.classList.remove('active');
      _stopMedia(n);
    });
    _activeLayers.clear();
    _updateMessageBackdrop();
  }

  // Toggle the "text shadow / translucent" backdrop on the message layer when it
  // sits over a video/image layer (so lyrics stay readable over media).
  function _updateMessageBackdrop() {
    const overlayed = _activeLayers.has('video') || _activeLayers.has('image');
    const msg = _layerEl('message');
    if (msg) msg.classList.toggle('has-backdrop', overlayed);
  }

  // Auto-fit scale for Song lyrics / Participant names, set per-render by the
  // operator's font-size choice (S/M/L/XL) so the chosen size is honoured.
  let _fitFontScale        = 1.0;
  let _participantFitScale = 1.0;
  // Operator's lyrics/content font-size in px (max cap for the auto-fit).
  let _fitFontCap          = 60;
  // Full set of stanzas/paragraphs for the current song, so every stanza is
  // sized to fit the TIGHTEST one — splitting lyrics into 2 vs 4 stanzas never
  // changes the projected size.
  let _fitAllSet           = null;
  function _setFitAll(all) { _fitAllSet = all; }

  // ── Media lifecycle ──────────────────────────────────────────────────────
  // Exactly one video/live element may show at a time. The operator console and
  // the server broadcast the same item to this page twice (direct render call +
  // socket echo), so a matching re-broadcast is skipped instead of restarting
  // the video — and a different item always tears the previous one down.
  let _curMediaKey = null;

  // Expose the layer helpers on window so the operator console (a parent window,
  // which loads this page in its preview iframe) can drive layer toggles from
  // the monitor's layer rail.
  window._showLayer      = _showLayer;
  window._hideLayer      = _hideLayer;
  window._clearLayers    = _clearLayers;
  window._layerIds       = _LAYER_IDS;
  window._activeLayers   = _activeLayers;
  window._layerEl        = _layerEl;
  window._updateMessageBackdrop = _updateMessageBackdrop;

  function setSlideType(type) {
    // Applies a per-type class to the message layer (for theme backgrounds) and
    // marks it active. When blank, the class/active-state is dropped first so
    // only the specific layer being shown is considered. Content is rendered
    // into the #slide child of #layer-message.
    const layer = document.getElementById('layer-message');
    const slide = document.getElementById('slide');
    if (!layer) return;
    if (type === 'blank') {
      layer.classList.remove('active');
    } else {
      layer.classList.add('active');
      _showLayer('message');
    }
    if (slide) slide.className = 'type-' + type;
    _updateMessageBackdrop();
    document.getElementById('waiting').classList.remove('visible');
  }

  // ── Text ───────────────────────────────────────────────────────────────────
  function renderText(data) {
    setSlideType('text');
    _setFitAll(Array.isArray(data.fit_all) ? data.fit_all : null);
    const slide = document.getElementById('slide');
    // Shared Character formatting (Song / Content / Participant) — mirrors the
    // operator's Content-style toolbar (size / align / family / bold / italic / color).
    const famMap = {
      default: undefined,
      serif:   "'Georgia', 'Times New Roman', serif",
      sans:    "'Segoe UI', Arial, sans-serif",
      script:  "'Brush Script MT', 'Segoe Script', cursive",
    };
    // Font-size: the operator enters a NUMBER (px) for lyrics / content text.
    // Legacy enum values (sm/md/lg/xl) are mapped to a px default for old items.
    function _fsCap(v) {
      const n = parseInt(v, 10);
      if (!isNaN(n) && n > 0) return n;
      return { sm: 40, md: 60, lg: 90, xl: 130 }[v] || 60;
    }
    // Participant names keep a relative scale based on the px cap.
    function _partScale(txt) {
      const n = parseInt(txt && txt.font_size, 10);
      return isNaN(n) ? ({ sm: 0.6, md: 1.0, lg: 1.3, xl: 1.6 }[txt && txt.font_size] || 1.0) : (Math.min(1.6, n / 60));
    }
    _fitFontCap = _fsCap(data.font_size);
    _fitFontScale = _partScale(data);
    _participantFitScale = _partScale(data);
    function _fontCss(txt) {
      const ff   = famMap[txt && txt.font_family];
      const fw   = txt && txt.text_bold   ? 'bold'   : 'normal';
      const fi   = txt && txt.text_italic ? 'italic' : 'normal';
      const ta   = txt && txt.text_align  ? txt.text_align : 'center';
      let cst = `font-weight:${fw};font-style:${fi};text-align:${ta};`;
      const ai  = ta === 'left' ? 'flex-start' : (ta === 'right' ? 'flex-end' : 'center');
      cst += `align-items:${ai};`;
      if (ff) cst += `font-family:${ff};`;
      if (txt && txt.text_color) cst += `color:${txt.text_color};`;
      return cst;
    }
    // Lyrics lines and participant names own CSS rules (color / font-family /
    // text-align) that block inheritance from the parent, so the operator's
    // toolbar choices (color, family, align, bold, italic) are applied directly
    // to each leaf element here — inline beats the stylesheet and the output
    // follows the toolbar on every render.
    function _applyTextColor(el, data) {
      const tc = (data && data.text_color || '').trim();
      const ta = (data && data.text_align) ? data.text_align : 'center';
      const fm = data && data.font_family ? famMap[data.font_family] : undefined;
      const fw = data && data.text_bold ? 'bold' : 'normal';
      const fi = data && data.text_italic ? 'italic' : 'normal';
      el.querySelectorAll('.slide-line, .slide-participant .name').forEach(function (n) {
        if (tc) n.style.color = tc;
        n.style.textAlign  = ta;
        if (fm) n.style.fontFamily = fm;
        n.style.fontWeight = fw;
        n.style.fontStyle  = fi;
      });
    }
    let html = '';

    if (data.stanza) {
      // Stanza slide: lyrics only
      html += `<div class="slide-lines" style="${_fontCss(data)}">`;
      (data.stanza.lines || []).forEach(l => {
        html += `<div class="slide-line">${esc(l)}</div>`;
      });
      html += `</div>`;
      slide.innerHTML = html;
      _applyTextColor(slide, data);
      fitLyricsToSlide();
      return;
    } else if (data.is_content_para) {
      // Content paragraph slide: song-style layout + auto-fit
      // Part label on every paragraph slide
      if (data.part) {
        const pFsSizes = { sm: 'clamp(1rem,3vw,2.5rem)', md: 'clamp(1.5rem,5vw,4rem)',
                           lg: 'clamp(2rem,7vw,5.5rem)', xl: 'clamp(2.5rem,9vw,7rem)' };
        const pFsVal = pFsSizes[data.part_font_size] || pFsSizes.md;
        const pCol = (data.text_color || '').trim();
        const pSt = pCol ? `color:${pCol};` : '';
        html += `<div class="slide-header"><div class="slide-part-label" style="font-size:${pFsVal};${pSt}">${esc(data.part)}</div></div>`;
      }
      // Bible verse slides: show the book reference as a header line
      if (data.is_bible_para && data.title) {
        const bCol = (data.text_color || '').trim();
        const bSt = bCol ? `color:${bCol};` : '';
        html += `<div class="slide-verse-ref" style="${bSt}">${esc(data.title)}</div>`;
      }
      html += `<div class="slide-lines">`;
      (data.body || '').split('\n').forEach(l => {
        html += `<div class="slide-line">${esc(l)}</div>`;
      });
      html += `</div>`;
      slide.innerHTML = html;
      _applyTextColor(slide, data);
      fitLyricsToSlide();
      return;
    } else {
      const hasParticipants = data.participants && data.participants.length;
      const isContent = !!data.body;

      if (data.part) {
        const pFsSizes = { sm: 'clamp(1rem,3vw,2.5rem)', md: 'clamp(1.5rem,5vw,4rem)',
                           lg: 'clamp(2rem,7vw,5.5rem)', xl: 'clamp(2.5rem,9vw,7rem)' };
        const pFsVal = pFsSizes[data.part_font_size] || pFsSizes.md;
        const pCol = (data.text_color || '').trim();
        const pSt = pCol ? `color:${pCol};` : '';
        html += `<div class="slide-part-label" style="font-size:${pFsVal};${pSt}">${esc(data.part)}</div>`;
      }

      // Centered title card content (title + hymn number)
      if (!hasParticipants && !isContent && data.title) {
        const tCol = (data.text_color || '').trim();
        const tSt = tCol ? `color:${tCol};` : '';
        html += `<div class="slide-part" style="${tSt}">${esc(data.title)}</div>`;
        if (data.hymn_number) {
          html += `<div class="slide-hymn-number" style="${tSt}">#${esc(String(data.hymn_number))}</div>`;
        }
      }

      if (data.body) {
        const cap = _fsCap(data.font_size);
        const fsVal = `clamp(1.5rem, ${(cap * 0.052).toFixed(2)}vw, ${cap}px)`;
        let cst = _fontCss(data) + `font-size:${fsVal};white-space:pre-wrap;`;
        html += `<div class="slide-body" style="${cst}">${esc(data.body)}</div>`;
      }

      if (hasParticipants) {
        const count = Math.min(data.participants.length, 3);
        html += `<div class="slide-participants count-${count}" style="${_fontCss(data)}">`;
        data.participants.forEach(p => {
          html += `<div class="slide-participant">`;
          html += `<span class="name">${esc(p.name || '')}</span>`;
          html += `</div>`;
        });
        html += `</div>`;
      }
    }

    slide.innerHTML = html;
    _applyTextColor(slide, data);
    if (data.participants && data.participants.length) fitParticipantNames();
  }

  function fitParticipantNames() {
    const limit = document.getElementById('slide').clientWidth * 0.55;
    const els = document.querySelectorAll('.slide-participant .name');
    if (!els.length) return;
    let minSize = Infinity;
    els.forEach(el => {
      let size = parseFloat(getComputedStyle(el).fontSize);
      while (el.scrollWidth > limit && size > 16) {
        size -= 1;
        el.style.fontSize = size + 'px';
      }
      minSize = Math.min(minSize, size);
    });
    minSize = Math.max(16, Math.floor(minSize * _participantFitScale));
    els.forEach(el => el.style.fontSize = minSize + 'px');
  }

  // ── Blank ──────────────────────────────────────────────────────────────────
  function renderBlank() {
    // Clears the active layers so a "blank / stop" hides every pulled output
    // (live, video, image, message, announcement) rather than leaving stale
    // content sitting behind a fresh layer.
    const layer = document.getElementById('layer-message');
    const slide = document.getElementById('slide');
    if (layer) layer.classList.remove('active');
    if (slide) { slide.className = 'type-blank'; slide.innerHTML = ''; }
    _hideLayer('video');
    _hideLayer('image');
    _hideLayer('announcement');
    _hidePip();
    document.getElementById('waiting').classList.remove('visible');
    _updateMessageBackdrop();
  }

  // ── Announcement ───────────────────────────────────────────────────────────
  function renderAnnouncement(data) {
    _showLayer('announcement');
    _updateMessageBackdrop();
    const slide = document.getElementById('layer-announcement');
    const text = data.text || data.message || '';
    const famMap = {
      default: undefined,
      serif:   "'Georgia', 'Times New Roman', serif",
      sans:    "'Segoe UI', Arial, sans-serif",
      script:  "'Brush Script MT', 'Segoe Script', cursive",
    };
    const ffVal = famMap[data.font_family];
    const fwVal = data.text_bold ? 'bold' : 'normal';
    const fiVal = data.text_italic ? 'italic' : 'normal';
    let cst = `font-weight:${fwVal};font-style:${fiVal};`;
    if (ffVal) cst += `font-family:${ffVal};`;
    if (data.text_color) cst += `color:${data.text_color};`;
    slide.innerHTML =
      `<div class="slide-template type-announcement"><div class="announcement-label">Announcement</div>
       <div class="announcement-text" style="${cst}">${esc(text)}</div></div>`;
    document.getElementById('waiting').classList.remove('visible');
  }

  // ── Image ──────────────────────────────────────────────────────────────────
  function renderImage(data) {
    _showLayer('image');
    _updateMessageBackdrop();
    const slide = document.getElementById('layer-image');
    const url = esc(data.url || data.src || '');

    slide.innerHTML =
      `<div class="img-blur-bg" style="background-image:url('${url}')"></div>
       <img class="img-main" src="${url}" alt="">`;

    const img    = slide.querySelector('.img-main');
    const blurBg = slide.querySelector('.img-blur-bg');

    function applyFit() {
      // Always show the FULL input at its own ratio (object-fit: contain), so a
      // 1920x1080 background stays 1920x1080 and is never stretched to cover a
      // wider custom screen. Landscape → plain contain; portrait → blur-pad the
      // empty sides so there's no hard black bar.
      const ratio = img.naturalWidth / img.naturalHeight;
      img.style.objectFit = 'contain';
      blurBg.style.display = (ratio && ratio < 16 / 9) ? 'block' : 'none';
    }

    if (img.complete && img.naturalWidth) applyFit();
    else img.addEventListener('load', applyFit);
  }

  // ── YouTube IFrame API loader ──────────────────────────────────────────────
  const _YT_RE         = /(?:youtube\.com\/(?:watch\?v=|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/;
  const _YT_ERR_MSG    = { 2: 'Invalid video ID', 100: 'Video not found or private',
                            101: 'Embedding disabled by owner', 150: 'Embedding disabled by owner' };
  let   _ytAPIReady    = false;
  const _ytAPIQueue    = [];

  window.onYouTubeIframeAPIReady = function () {
    _ytAPIReady = true;
    _ytAPIQueue.forEach(fn => fn());
    _ytAPIQueue.length = 0;
  };

  function _loadYTAPI(cb) {
    if (_ytAPIReady) { cb(); return; }
    _ytAPIQueue.push(cb);
    if (!document.querySelector('script[src*="youtube.com/iframe_api"]')) {
      const s = document.createElement('script');
      s.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(s);
    }
  }

  // ── Video ──────────────────────────────────────────────────────────────────
  function renderVideo(data) {
    _showLayer('video');
    _updateMessageBackdrop();
    // Hide the "Waiting for content…" overlay — media is now showing.
    document.getElementById('waiting').classList.remove('visible');
    const slide = document.getElementById('layer-video');

    const url     = data.url || data.src || '';
    const key     = 'video:' + url;
    // Same item pushed again while it is already mounted → keep it playing
    // (prevents the restart flicker when direct-render and socket echo arrive).
    if (key === _curMediaKey && slide.querySelector('video, iframe')) { return; }
    _curMediaKey = key;

    slide.innerHTML = '';

    const ytMatch = url.match(_YT_RE);

    if (ytMatch) {
      const videoId  = ytMatch[1];
      const wantAudio = (data.mute === true) ? false : true;  // unmute after play unless explicitly muted
      const auto      = (data.autoplay !== false) ? 1 : 0;

      const container = document.createElement('div');
      slide.appendChild(container);

      _loadYTAPI(function () {
        new YT.Player(container, {
          width: '100%', height: '100%',
          videoId: videoId,
          playerVars: {
            autoplay:       auto,
            mute:           1,   // always start muted so browser allows autoplay
            loop:           data.loop ? 1 : 0,
            playlist:       data.loop ? videoId : undefined,
            controls:       0,
            modestbranding: 1,
            rel:            0,
          },
          events: {
            onReady: function (e) {
              if (auto) e.target.playVideo();
            },
            onStateChange: function (e) {
              // Once playing, unmute if the item doesn't have mute checked
              if (e.data === YT.PlayerState.PLAYING && wantAudio) {
                e.target.unMute();
                e.target.setVolume(100);
                socket.emit('media:status', { channel: CHANNEL, audio: 'ok' });
                // Like the local <video> path: unmuting inside a context
                // without sound-autoplay permission can pause playback.
                // Recover by going muted and resuming the picture.
                setTimeout(function () {
                  if (e.target.getPlayerState && e.target.getPlayerState() === YT.PlayerState.PAUSED) {
                    e.target.mute();
                    e.target.playVideo();
                    socket.emit('media:status', { channel: CHANNEL, audio: 'muted' });
                  }
                }, 250);
              }
            },
            onError: function (e) {
              const msg = _YT_ERR_MSG[e.data] || `Playback error (code ${e.data})`;
              slide.innerHTML =
                `<div class="yt-blocked-overlay">
                   <span class="yt-blocked-icon">⛔</span>
                   <span class="yt-blocked-msg">${msg}</span>
                   <span class="yt-blocked-hint">Download the video to play it locally</span>
                 </div>`;
              socket.emit('media:blocked', { channel: CHANNEL, video_id: videoId, code: e.data, message: msg });
            },
          },
        });
      });
    } else {
      const vid = document.createElement('video');
      vid.src         = url;
      vid.loop        = data.loop || false;
      vid.muted       = true;   // always start muted — unmuted after play() resolves
      vid.playsInline = true;
      vid.preload     = 'auto';
      vid.style.cssText = 'width:100%;height:100%;object-fit:contain;background:transparent;';
      slide.appendChild(vid);

      const wantAudio = (data.mute !== true);
      vid.play()
        .then(() => {
          if (!wantAudio) {
            // Explicitly muted — keep it silent and playing.
            socket.emit('media:status', { channel: CHANNEL, audio: 'muted' });
            return;
          }
          vid.muted = false;
          // Chrome pauses playback when unmuting inside a context without
          // sound-autoplay permission (e.g. /ch1 embedded in the custom
          // output iframe). If that happens, fall back to muted playback so
          // the video keeps playing instead of freezing.
          setTimeout(function () {
            if (vid.paused && !vid.ended) {
              vid.muted = true;
              vid.play()
                .then(() => socket.emit('media:status', { channel: CHANNEL, audio: 'muted' }))
                .catch(() => socket.emit('media:status', { channel: CHANNEL, audio: 'blocked' }));
              return;
            }
            socket.emit('media:status', { channel: CHANNEL, audio: 'ok' });
          }, 250);
        })
        .catch(() => {
          // Stay muted — video still plays silently (acceptable on Smart TVs)
          socket.emit('media:status', { channel: CHANNEL, audio: 'muted' });
        });
    }
  }

  // ── Live input ─────────────────────────────────────────────────────────────
  var _liveStreams = {};
  // Server-side live input: show the MJPEG stream relayed by the server, so a
  // capture card/hdmi input plugged into the SERVER machine can be shown here
  // even though this projection client never has direct access to that device.
  var _liveImgEl = null;
  function renderLive(data) {
    _showLayer('video');
    _updateMessageBackdrop();
    const slide = document.getElementById('layer-video');
    // Hide the "Waiting for content…" overlay — a live stream is now showing.
    document.getElementById('waiting').classList.remove('visible');

    // New path: server-side live source (source_index) -> MJPEG from server.
    const srcIdx = data.source_index;

    const key = (srcIdx !== undefined && srcIdx !== null && srcIdx !== '')
      ? ('live:s' + srcIdx)
      : ('live:c' + (data.device_id || ''));
    // A live stream is kept running across identical re-pushes (dedupe), BUT
    // only while the same <img> is still attached. Any render in between runs
    // slide.innerHTML='' above, which detaches the old element while the JS
    // variable keeps referencing it — re-using it then sets .src on a detached
    // node and the second push shows nothing. So: skip ONLY when the element is
    // still in the DOM; otherwise fully re-render and re-attach it.
    if (key === _curMediaKey && _liveImgEl && _liveImgEl.parentNode) { return; }
    _curMediaKey = key;

    slide.innerHTML = '';

    if (srcIdx !== undefined && srcIdx !== null && srcIdx !== '') {
      // Tear down any prior browser-camera stream.
      Object.keys(_liveStreams).forEach(function (k) {
        _liveStreams[k].getTracks().forEach(function (t) { t.stop(); });
      });
      _liveStreams = {};

      if (!_liveImgEl) {
        _liveImgEl = document.createElement('img');
        _liveImgEl.alt = 'Live input';
        _liveImgEl.style.cssText = 'width:100%;height:100%;object-fit:contain;background:transparent;';
      }
      slide.appendChild(_liveImgEl);
      _liveImgEl.src = 'http://' + window.location.hostname + ':5002/live/feed/' + encodeURIComponent(srcIdx) + '.mjpeg';
      return;
    }

    // Fallback: browser-side device capture (getUserMedia).
    const deviceId = data.device_id || '';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      slide.innerHTML = '<div class="slide-lines"><div class="slide-line">Live input not supported in this browser.</div></div>';
      return;
    }

    const vid = document.createElement('video');
    vid.autoplay    = true;
    vid.playsInline = true;
    vid.muted       = true;
    vid.style.cssText = 'width:100%;height:100%;object-fit:contain;background:transparent;';
    slide.appendChild(vid);

    if (_liveStreams[deviceId]) {
      _liveStreams[deviceId].getTracks().forEach(function (t) { t.stop(); });
    }
    navigator.mediaDevices.getUserMedia({ video: deviceId ? { deviceId: { exact: deviceId } } : true, audio: false })
      .then(function (stream) {
        _liveStreams[deviceId] = stream;
        vid.srcObject = stream;
      })
      .catch(function (err) {
        slide.innerHTML = '<div class="slide-lines"><div class="slide-line">Unable to access live input.</div></div>';
        socket.emit('media:status', { channel: CHANNEL, audio: 'err', message: String(err) });
      });
  }

  // ── Live dispatch: full-screen OR picture-in-picture (PiP) ─────────────────
  // The operator console's Live panel sends pip_enable / pip_corner / pip_size
  // along with the live push. When pip_enable is true, keep the current
  // full-screen content and mount the live camera feed in a small corner box
  // (this is what the broadcast headless render /ch1 captures). When it is
  // false/absent, fall back to the existing full-screen live render.
  function _hidePip() {
    const box = document.getElementById('pip-box');
    const img = document.getElementById('pip-img');
    if (!box || !img) return;
    box.classList.remove('visible');
    img.removeAttribute('src');
  }

  function _mountPip(data) {
    const box = document.getElementById('pip-box');
    const img = document.getElementById('pip-img');
    if (!box || !img) return;
    const corner = ['tr', 'tl', 'br', 'bl'].indexOf(data.pip_corner) >= 0 ? data.pip_corner : 'tr';
    const size   = ['sm', 'md', 'lg'].indexOf(data.pip_size) >= 0 ? data.pip_size : 'md';
    box.classList.remove('corner-tr', 'corner-tl', 'corner-br', 'corner-bl');
    box.classList.remove('size-sm', 'size-md', 'size-lg');
    box.classList.add('corner-' + corner, 'size-' + size);
    img.src = 'http://' + window.location.hostname + ':5002/live/feed/' + encodeURIComponent(data.source_index) + '.mjpeg';
    box.classList.add('visible');
    // A live box is now showing — drop the "Waiting for content…" overlay.
    document.getElementById('waiting').classList.remove('visible');
  }

  function handleLive(data) {
    const cfg = (data && data.data) || data || {};
    // Operator's custom-output feed toggle (mirror on/off) targets the custom
    // output channel, never this projection — ignore it if it ever lands here.
    if (cfg.mirror === 'on' || cfg.mirror === 'off') { return; }
    const srcIdx = cfg.source_index;
    const srcGiven = srcIdx !== undefined && srcIdx !== null && srcIdx !== '';
    if (cfg.pip_enable === true && srcGiven) {
      // PiP mode is BROADCAST-ONLY (see IS_BROADCAST above): the broadcast
      // render mounts the small live box overlay on top of the full-screen
      // content, while every other screen keeps its clean full-screen view.
      if (!IS_BROADCAST) { return; }
      _mountPip(cfg);
      return;
    }
    // Full-screen live (or fallback path) — tear the box down.
    _hidePip();
    renderState(data);
  }

  // Dedicated PiP overlay command (pip:set {show, source_index, pip_corner,
  // pip_size}). Independent of any content push: it only mounts or tears down
  // the small live box and never touches the full-screen content underneath,
  // so lyrics/slides keep showing while the box is up. Broadcast-only, like
  // the media:live PiP path above — operator/projector screens stay clean.
  function handlePip(data) {
    const cfg = (data && data.data) || data || {};
    if (!IS_BROADCAST) { _hidePip(); return; }
    const srcIdx = cfg.source_index;
    const srcGiven = srcIdx !== undefined && srcIdx !== null && srcIdx !== '';
    if (cfg.show === true && srcGiven) {
      _mountPip(cfg);
      return;
    }
    _hidePip();
  }

  // Remote screen-share overlay (live:start / live:frame / live:stop from a
  // /share presenting PC, via the share bridge). Full-screen base64 JPEG
  // frames; shown only while the operator has this presenter selected.
  var _remoteImgEl = null;
  function _remoteImg() {
    if (!_remoteImgEl) _remoteImgEl = document.getElementById('live-remote-img');
    return _remoteImgEl;
  }
  function _remoteShow(data) {
    var wrap = document.getElementById('live-remote-wrap');
    if (!wrap) return;
    document.getElementById('waiting').classList.remove('visible');
    wrap.classList.add('visible');
  }
  function _remoteFrame(data) {
    var img = _remoteImg();
    if (!img || !data || !data.data) return;
    img.src = 'data:image/jpeg;base64,' + data.data;
    var wrap = document.getElementById('live-remote-wrap');
    if (wrap && !wrap.classList.contains('visible')) {
      document.getElementById('waiting').classList.remove('visible');
      wrap.classList.add('visible');
    }
  }
  function _remoteHide() {
    var wrap = document.getElementById('live-remote-wrap');
    if (wrap) wrap.classList.remove('visible');
    var img = _remoteImg();
    if (img) img.removeAttribute('src');
  }

  // ── Timer ──────────────────────────────────────────────────────────────────
  function renderTimer(data) {
    setSlideType('timer');
    _timerSeconds = data.seconds || 0;
    _timerLabel   = data.label   || '';
    _updateTimerDisplay();
    if (data.running) startTimer(data);
  }

  function startTimer(data) {
    if (data && data.seconds !== undefined) _timerSeconds = data.seconds;
    if (data && data.label   !== undefined) _timerLabel   = data.label;
    setSlideType('timer');
    stopTimer();
    _timerInterval = setInterval(function () {
      if (_timerSeconds > 0) {
        _timerSeconds--;
        _updateTimerDisplay();
      } else {
        stopTimer();
      }
    }, 1000);
  }

  function pauseTimer() {
    stopTimer();
  }

  function resetTimer(data) {
    stopTimer();
    _timerSeconds = (data && data.seconds) || 0;
    _timerLabel   = (data && data.label)   || _timerLabel;
    _updateTimerDisplay();
  }

  function stopTimer() {
    if (_timerInterval) { clearInterval(_timerInterval); _timerInterval = null; }
  }

  function _updateTimerDisplay() {
    const m = Math.floor(_timerSeconds / 60);
    const s = _timerSeconds % 60;
    const str = m + ':' + String(s).padStart(2, '0');
    const urgent = _timerSeconds <= 60 && _timerSeconds > 0;
    const slide = document.getElementById('slide');
    slide.innerHTML =
      `<div class="timer-digits${urgent ? ' urgent' : ''}">${str}</div>
       <div class="timer-label">${esc(_timerLabel)}</div>`;
  }

  // ── Utility ────────────────────────────────────────────────────────────────
  function esc(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── Fit lyrics to fill the slide ───────────────────────────────────────────
  function fitLyricsToSlide() {
    const slide = document.getElementById('slide');
    const lines = slide.querySelector('.slide-lines');
    if (!lines) return;
    const st     = getComputedStyle(slide);
    const availH = slide.clientHeight - parseFloat(st.paddingTop)  - parseFloat(st.paddingBottom);
    const availW = slide.clientWidth;
    if (availH <= 0 || availW <= 0) return;
    // Operator's number (px) is the target size: the output must match the
    // toolbar exactly. Shrink only when the text would overflow the slide —
    // never grow past what the operator set, so the projection visibly follows
    // the value in the size box.
    const exact = _fitFontCap || 60;
    const current = Array.from(lines.children).map(el => el.innerText);

    // Probe element: a detached clone of the lyric block used for measurement,
    // so the live lines are never mutated while we size things. It carries the
    // same geometry (the slide is pinned relative for the duration).
    const prevPos = slide.style.position;
    slide.style.position = 'relative';
    const probe = lines.cloneNode(false);
    probe.style.position = 'absolute';
    probe.style.top = '0';
    probe.style.left = '0';
    probe.style.pointerEvents = 'none';
    slide.appendChild(probe);

    function build(stanzaLines) {
      probe.innerHTML = '';
      (stanzaLines || []).forEach(function (l) {
        const d = document.createElement('div');
        d.className = 'slide-line';
        d.textContent = l;
        probe.appendChild(d);
      });
    }
    function fits() {
      return probe.scrollHeight <= availH && probe.scrollWidth <= availW;
    }
    function candidatesFit() {
      const c = candidates;
      for (let i = 0; i < c.length; i++) { build(c[i]); if (!fits()) return false; }
      return true;
    }

    // Uniform per-song sizing: when the operator sends the full stanza set,
    // size everything for the tightest stanza so splitting lyrics into 2, 3 or
    // 4 stanzas never makes the output bigger. Otherwise fall back to sizing
    // the current stanza alone (same as before).
    const candidates = (_fitAllSet && _fitAllSet.length) ? _fitAllSet : [current];

    probe.style.fontSize = exact + 'px';
    if (candidatesFit()) {
      lines.style.fontSize = exact + 'px';
    } else {
      let lo = 20, hi = exact;
      while (hi - lo > 1) {
        const mid = (lo + hi) / 2;
        probe.style.fontSize = mid + 'px';
        if (candidatesFit()) lo = mid;
        else hi = mid;
      }
      lines.style.fontSize = Math.floor(lo) + 'px';
    }
    probe.remove();
    slide.style.position = prevPos;
  }

  let _lyricsFitRaf;
  window.addEventListener('resize', function () {
    if (!document.querySelector('#slide .slide-lines')) return;
    cancelAnimationFrame(_lyricsFitRaf);
    _lyricsFitRaf = requestAnimationFrame(fitLyricsToSlide);
  });

  // ── Projection aspect ratio ──────────────────────────────────────────
  var _projAspect = '{{ aspect }}';

  function _projApplyAspect(aspect) {
    if (aspect !== undefined) _projAspect = aspect;
    var c = document.getElementById('proj-content');
    if (!c) return;
    c.style.width = '';
    c.style.height = '';
    if (!_projAspect || _projAspect === 'off' || _projAspect === 'auto') return;
    var m = /(\d+)\s*[:xX]\s*(\d+)/.exec(String(_projAspect));
    if (!m) return;
    var w = +m[1], h = +m[2];
    var W = Math.min(window.innerWidth, window.innerHeight * w / h);
    var H = W * h / w;
    c.style.width = W + 'px';
    c.style.height = H + 'px';
  }
  _projApplyAspect();

  socket.on('aspect:update', function (data) {
    _projApplyAspect(data && data.aspect);
  });

  var _projResizeRaf;
  window.addEventListener('resize', function () {
    cancelAnimationFrame(_projResizeRaf);
    _projResizeRaf = requestAnimationFrame(function () { _projApplyAspect(); });
  });
</script>
<div id="output-close" style="display:none;position:fixed;top:10px;right:14px;z-index:99999;opacity:.55;transition:opacity .3s;">
  <button onclick="outputClose()" title="Close output" style="width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.55);color:#fff;font-size:18px;line-height:1;cursor:pointer;">&#10005;</button>
</div>
<script>
  (function(){
    if (location.search.indexOf('output=1') === -1) return;
    var el = document.getElementById('output-close');
    el.style.display = 'block';
    var hideTimer;
    function hide(){ el.style.opacity = '0'; }
    function show(){ el.style.opacity = '.55'; }
    el.addEventListener('mouseenter', show);
    el.addEventListener('mouseleave', hide);
    document.addEventListener('mousemove', function(){
      show(); clearTimeout(hideTimer); hideTimer = setTimeout(hide, 4000);
    });
  })();
  function outputClose(){
    try {
      fetch('/api/output/close', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ channel: CHANNEL })
      }).catch(function(){});
    } catch(e){}
    setTimeout(function(){
      try { window.close(); } catch(e){}
      setTimeout(function(){
        try { window.top.location.replace('about:blank'); } catch(e){}
      }, 120);
    }, 60);
  }
</script>
<!-- Auto-reload when the server ships a new build (stale tabs self-heal). -->
<script>
(function () {
  var seen = null;
  function poll() {
    fetch('/api/server_version?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.build) return;
        var meta = document.querySelector('meta[name="x-build"]');
        if (meta && meta.content && meta.content !== j.build) { location.reload(); return; }
        if (!meta || !meta.content) { if (seen !== null && seen !== j.build) location.reload(); seen = j.build; }
      })
      .catch(function () {});
    setTimeout(poll, 5000);
  }
  setTimeout(poll, 2000);
})();
</script>
